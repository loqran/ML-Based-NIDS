[project]
name = "course-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "loqran", email = "325322671+loqran@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.53.0",
    "xgboost>=3.4.1",
]

[project.scripts]
course-project = "course_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "csvkit>=2.2.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pyarrow>=26.0.0",
]
